<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image → 3D</title>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
body{margin:0;background:#0a0d10;color:#dbe6e8;font-family:system-ui,sans-serif}main{max-width:720px;margin:auto;padding:24px 18px}.panel{background:#10151a;border:1px solid #1e2830;border-radius:10px;padding:18px;margin-bottom:16px}.drop{border:1px dashed #33434a;border-radius:10px;padding:40px 16px;text-align:center;cursor:pointer}.drop strong{color:#fff}input{display:none}#preview{display:none;text-align:center}#preview img{max-width:100%;max-height:320px;border-radius:8px}.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.setting{border:1px solid #1e2830;border-radius:8px;padding:10px}.setting label{display:block;font-size:11px;color:#789096;margin-bottom:6px}.setting select{width:100%;background:#080b0e;color:#dbe6e8;border:1px solid #1e2830;padding:8px;border-radius:6px}.primary{width:100%;margin-top:14px;padding:13px;background:#2fd9d1;color:#04120f;border:0;border-radius:8px;font-weight:650}.primary:disabled{opacity:.4}.secondary{width:100%;margin-top:8px;padding:11px;background:transparent;color:#789096;border:1px solid #1e2830;border-radius:8px}.status{display:none;margin-top:14px;font:12px monospace;color:#789096}.status.show{display:block}.error{color:#ff6b5e}.ok{color:#74e6a5}#result{display:none}model-viewer{width:100%;height:460px;background:#05070a;border-radius:8px}.actions{display:flex;gap:8px;margin-top:12px}.actions>*{flex:1;padding:11px;text-align:center}.download{background:#2fd9d1;color:#04120f;text-decoration:none;border-radius:8px;font-weight:650}button{cursor:pointer}.note{font-size:12px;color:#789096}@media(max-width:560px){.settings{grid-template-columns:1fr}model-viewer{height:360px}}
</style>
</head>
<body>
<main>
<h2>Image → 3D</h2>
<section class="panel">
<div class="drop" id="drop"><strong>Tap to upload a photo</strong><br>PNG/JPG/WebP · transparent subjects work best</div>
<input id="file" type="file" accept="image/png,image/jpeg,image/webp">
<div id="preview"><img id="previewImg" alt="Input preview"><p id="name"></p></div>
<div class="settings">
<div class="setting"><label>Generation resolution</label><select id="resolution"><option value="512">512 — faster</option><option value="1024" selected>1024 — recommended</option><option value="1536">1536 — highest</option></select></div>
<div class="setting"><label>Texture size</label><select id="texture"><option value="1024">1024</option><option value="2048" selected>2048 — recommended</option><option value="4096">4096 — high</option></select></div>
</div>
<button class="primary" id="generate" disabled>Generate 3D model</button>
<button class="secondary" id="clear" style="display:none">Choose a different image</button>
<div class="status" id="status"></div>
</section>
<section class="panel" id="result">
<h3>Generated GLB</h3>
<model-viewer id="viewer" camera-controls auto-rotate shadow-intensity="1" interaction-prompt="none"></model-viewer>
<div class="actions"><a class="download" id="download" download="trellis2-model.glb">Download GLB</a><button id="again">Try again</button></div>
</section>
<p class="note">Powered by microsoft/TRELLIS.2 using its two-stage /image_to_3d → /extract_glb pipeline.</p>
</main>
<script type="module">
import {Client,handle_file} from "https://esm.sh/@gradio/client@2.3.1";
const SPACE="microsoft/TRELLIS.2",GEN="/image_to_3d",EXT="/extract_glb";
const $=x=>document.getElementById(x);
let selected=null,url=null;
const drop=$("drop"),file=$("file"),preview=$("preview"),img=$("previewImg"),name=$("name"),gen=$("generate"),clear=$("clear"),status=$("status"),result=$("result"),viewer=$("viewer"),download=$("download"),again=$("again"),resolution=$("resolution"),texture=$("texture");
function msg(t,c=""){status.textContent=t;status.className="status show "+c}
function choose(f){if(!f||!f.type.startsWith("image/"))return msg("Please choose a JPG, PNG, or WebP image.","error");if(f.size>25*1024*1024)return msg("Image must be under 25 MB.","error");selected=f;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);img.src=url;name.textContent=f.name;drop.style.display="none";preview.style.display="block";clear.style.display="block";gen.disabled=false;result.style.display="none";status.className="status"}
drop.onclick=()=>file.click();file.onchange=e=>choose(e.target.files?.[0]);drop.ondragover=e=>{e.preventDefault()};drop.ondrop=e=>{e.preventDefault();choose(e.dataTransfer.files?.[0])};clear.onclick=()=>location.reload();again.onclick=()=>selected&&gen.click();
async function run(client,endpoint,payload,label){const job=client.submit(endpoint,payload);let data;for await(const m of job){if(m.type==="status"){if(m.stage==="pending")msg(label+" — waiting…");else if(m.stage==="generating")msg(m.message||label+" — processing…");else if(m.stage==="error")throw Error(m.message||label+" failed")}else if(m.type==="data")data=m.data}if(!data)throw Error(label+" returned no data");return data}
function findUrl(v){if(!v)return null;if(typeof v==="string")return /^https?:\/\//i.test(v)?v:null;if(Array.isArray(v)){for(const x of v){const u=findUrl(x);if(u)return u}}if(typeof v==="object")return findUrl(v.url)||findUrl(v.path)||findUrl(v.value)||findUrl(v.data);return null}
gen.onclick=async()=>{gen.disabled=true;clear.style.display="none";try{msg("Connecting to TRELLIS.2…");const client=await Client.connect(SPACE);const stateData=await run(client,GEN,{image:handle_file(selected),seed:Math.floor(Math.random()*2147483647),resolution:resolution.value,ss_guidance_strength:7.5,ss_guidance_rescale:0.7,ss_sampling_steps:12,ss_rescale_t:5,shape_slat_guidance_strength:7.5,shape_slat_guidance_rescale:0.5,shape_slat_sampling_steps:12,shape_slat_rescale_t:3,tex_slat_guidance_strength:1,tex_slat_guidance_rescale:0,tex_slat_sampling_steps:12,tex_slat_rescale_t:3},"3D generation");const state=Array.isArray(stateData)?stateData[0]:stateData;if(!state)throw Error("Invalid TRELLIS.2 generation state");msg("Extracting GLB…");const out=await run(client,EXT,{state,decimation_target:300000,texture_size:Number(texture.value)},"GLB extraction");const glb=findUrl(out);if(!glb)throw Error("No GLB file URL was returned");viewer.src=glb;download.href=glb;result.style.display="block";msg("3D model ready.","ok");result.scrollIntoView({behavior:"smooth"})}catch(e){console.error(e);msg("Generation failed: "+(e.message||e),"error");gen.disabled=false;clear.style.display="block"}};
</script>
</body>
</html>
